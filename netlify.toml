[build]
  publish = "/"
  command = "echo 'No build needed'"

# السماح بملف التحقق بالوصول المباشر
[[redirects]]
  from = "/validation-key.txt"
  to = "/validation-key.txt"
  status = 200
  force = true

# السماح بباقي ملفات .txt
[[redirects]]
  from = "/*.txt"
  to = "/:splat"
  status = 200
  force = true

# توجيه باقي الطلبات إلى index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
